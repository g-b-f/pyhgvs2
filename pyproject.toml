[project]
name = "pyhgvs2"
version = "3.0.4"
description = "Fork of pyhgvs"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["hgvs", "bioinformatics", "genome", "variant", "DNA", "RNA"]
dependencies = []

[project.scripts]
hgvs = "bin:hgvs"


[project.urls]
Repository = "https://github.com/g-b-f/pyhgvs2"

[dependency-groups]
dev = [
    "pyfaidx==0.8.1.*",
    "pytest-mock==3.14.*",
    "ruff==0.11.*",
    "mypy==1.15.*",
    "pytest-benchmark>=5.1.0",
]

[tool.mypy]
check_untyped_defs = true
follow_untyped_imports = true
exclude = [
    "pyhgvs/tests"
]
[tool.ruff]
extend-include = ["bin/"]

[tool.ruff.lint]
extend-select = [
    "BLE",  # Blind exceptions
    "A",    # Builtin shadowing
    "C4",   # Comprehensions
    "LOG",  # Logging
    "G",    # Logging formatting
    "I",    # isort
    "UP",   # pyupgrade
    "ISC",  # String concatenation
    "ICN",  # Import conventions
    "RET",  # Return conventions
    "FURB", # refurb
    "B",    # flake8-bugbear
    "TCH",  # Type checking
]

ignore = [
    "RET503",  # Explicit return
    "B007",    # Unused loop control variable
    "TC006",   # Quote type casting
]

[tool.pytest.ini_options]
filterwarnings = ["error"]
markers = [
    "benchmark: marks tests as benchmark tests",
]

# Benchmark configuration
[tool.pytest.benchmark]
group_by = "name"
sort = "mean"
min_rounds = 3
max_time = 5.0
timer = "time.perf_counter"
disable_gc = false
warmup = false
