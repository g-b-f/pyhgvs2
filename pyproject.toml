[project]
name = "pyhgvs2"
version = "3.0.0"
description = "Fork of pyhgvs"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["hgvs", "bioinformatics", "genome", "variant", "DNA", "RNA"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
hgvs = "bin:hgvs"

[project.urls]
Repository = "https://github.com/g-b-f/pyhgvs2"
Homepage = "https://github.com/g-b-f/pyhgvs2"
Issues = "https://github.com/g-b-f/pyhgvs2/issues"

[dependency-groups]
dev = [
    "pyfaidx==0.8.1.*",
    "pytest-mock==3.14.*",
    "ruff==0.11.*",
    "mypy==1.15.*",
    "pytest>=7.0.0",
    "pytest-benchmark>=5.1.0",
]

[tool.mypy]
check_untyped_defs = true
follow_untyped_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
exclude = [
    "pyhgvs2/tests"
]

[tool.ruff]
extend-include = ["bin/"]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
]

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["pyhgvs2/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "benchmark: marks tests as benchmark tests",
]

# Benchmark configuration
[tool.pytest.benchmark]
group_by = "name"
sort = "mean"
min_rounds = 3
max_time = 5.0
timer = "time.perf_counter"
disable_gc = false
warmup = false
