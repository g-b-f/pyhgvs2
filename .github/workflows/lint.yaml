name: Linting, Testing, and Benchmarking
on: [pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check if version was bumped
        run: |
          if git diff origin/master -- pyproject.toml | grep -q "version"; then
            echo "Version was changed in pyproject.toml"
          else
            echo "Remember to bump version in pyproject.toml"
            exit 1
          fi
      - name: Install uv, set python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: ruff
        uses: astral-sh/ruff-action@v3
      - name: Install project
        run: uv sync --locked --all-extras --dev
      - name: Run tests
        run: uv run pytest pyhgvs2/tests --ignore=pyhgvs2/tests/test_benchmark.py

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    # Only run benchmarks on Python 3.11 to avoid redundant runs
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Install uv, set python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --all-extras --dev
      
      - name: Run benchmarks
        run: |
          uv run pytest pyhgvs2/tests/test_benchmark.py \
            --benchmark-only \
            --benchmark-verbose \
            --benchmark-sort=name \
            --benchmark-min-rounds=3
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            .benchmarks/
            benchmark.json
          retention-days: 30
