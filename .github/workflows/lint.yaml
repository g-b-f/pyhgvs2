name: Linting, Testing, and Benchmarking
on: [pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check if version was bumped
        run: |
          if git diff origin/master -- pyproject.toml | grep -q "version"; then
            echo "Version was changed in pyproject.toml"
          else
            echo "Remember to bump version in pyproject.toml"
            exit 1
          fi
      - name: Install uv, set python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: ruff
        uses: astral-sh/ruff-action@v3
      - name: Install project
        run: uv sync --locked --all-extras --dev
      - name: Run tests
        run: uv run pytest pyhgvs2/tests --ignore=pyhgvs2/tests/test_benchmark.py

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    # Only run benchmarks on Python 3.12 to avoid redundant runs
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Install uv, set python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --all-extras --dev
      
      - name: Run benchmarks
        timeout-minutes: 8
        run: >
          uv run pytest pyhgvs2/tests/test_benchmark.py \
            --benchmark-only \
            --benchmark-verbose \
            --benchmark-sort=name \
            --benchmark-min-rounds=3 \
            --benchmark-max-time=5.0 \
            --benchmark-json=benchmark_results.json
      
      - name: Install Bencher CLI
        uses: bencherdev/bencher@main
      
      - name: Track benchmarks with Bencher
        run: |
          bencher run \
            --project pyhgvs2 \
            --token "${{ secrets.BENCHER_API_TOKEN }}" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --testbed github-actions \
            --adapter python_pytest \
            --file benchmark_results.json \
            --err
        if: always()
      
      - name: Upload benchmark results (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            .benchmarks/
            benchmark_results.json
          retention-days: 30
